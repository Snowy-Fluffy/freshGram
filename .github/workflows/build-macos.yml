name: Build macOS

on:
  push:
    branches-ignore:
      - 'dependabot/**'
    tags:
      - 'v*'
    paths-ignore:
      - 'docs/**'
      - '**.md'
      - 'changelog.txt'
      - 'LEGAL'
      - 'LICENSE'
      - 'Telegram/build/docker/centos_env/**'
      - '.github/workflows/build-env.yml'
      - '.github/workflows/build.yml'
  workflow_dispatch:
    inputs:
      release_tag:
        description: Publish a GitHub release with this tag (for example v7.2.18), leave empty to only build
        type: string
        required: false
      source_ref:
        description: Tag, branch or commit to build instead of the one the workflow is started on
        type: string
        required: false

concurrency:
  group: build-macos-${{ github.ref }}-${{ github.event_name }}-${{ github.event.inputs.release_tag }}
  cancel-in-progress: ${{ github.event_name != 'workflow_dispatch' && !startsWith(github.ref, 'refs/tags/') }}

permissions:
  contents: write

env:
  BUILD_CONFIG: ${{ (github.ref_type == 'tag' || github.event.inputs.release_tag != '') && 'Release' || 'Debug' }}

jobs:
  libraries:
    name: macOS libraries
    runs-on: macos-15
    timeout-minutes: 360

    steps:
      - name: Free up disk space
        run: |
          df -h /
          keep=$(readlink -f /Applications/Xcode.app || true)
          for xcode in /Applications/Xcode_*.app; do
            if [ "$(readlink -f "$xcode")" != "$keep" ]; then
              sudo rm -rf "$xcode"
            fi
          done
          sudo rm -rf /Library/Developer/CoreSimulator ~/Library/Developer/CoreSimulator || true
          sudo rm -rf ~/Library/Android /Users/runner/Library/Android ~/.dotnet /usr/local/share/dotnet || true
          sudo rm -rf ~/hostedtoolcache /Users/runner/hostedtoolcache || true
          df -h /

      - name: Clone
        uses: actions/checkout@v4
        with:
          path: freshGram
          ref: ${{ github.event.inputs.source_ref || github.ref }}
          submodules: recursive

      - name: Install tools
        run: |
          brew install automake libtool cmake wget pkg-config gnu-tar ninja nasm meson zstd
          sudo xcode-select -s /Applications/Xcode.app/Contents/Developer

      - name: Prepare libraries
        timeout-minutes: 340
        run: ./freshGram/Telegram/build/prepare/mac.sh silent

      - name: Show why the libraries failed
        if: failure()
        run: |
          df -h /
          vm_stat | head -8
          for dir in Libraries/tg_owt/out/*/; do
            [ -f "$dir/build.ninja" ] || continue
            echo "::group::$dir"
            (cd "$dir" && ninja -v 2>&1 | tail -n 60) || true
            echo "::endgroup::"
          done

      - name: Pack libraries
        run: |
          gtar -I 'zstd -T0 -3' -cf libraries.tar.zst Libraries ThirdParty
          ls -la libraries.tar.zst

      - name: Upload libraries
        uses: actions/upload-artifact@v4
        with:
          name: macos-libraries
          path: libraries.tar.zst
          retention-days: 1
          compression-level: 0

  app:
    name: macOS ${{ matrix.suffix }}
    needs: libraries
    runs-on: macos-15
    timeout-minutes: 360
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: arm64
            suffix: arm64
          - arch: x86_64
            suffix: x64

    steps:
      - name: Check API credentials
        env:
          API_ID: ${{ secrets.API_ID }}
          API_HASH: ${{ secrets.API_HASH }}
        run: |
          if [ -z "$API_ID" ] || [ -z "$API_HASH" ]; then
            echo "::error::Repository secrets API_ID and API_HASH are required, see docs/api_credentials.md."
            exit 1
          fi

      - name: Free up disk space
        run: |
          df -h /
          keep=$(readlink -f /Applications/Xcode.app || true)
          for xcode in /Applications/Xcode_*.app; do
            if [ "$(readlink -f "$xcode")" != "$keep" ]; then
              sudo rm -rf "$xcode"
            fi
          done
          sudo rm -rf /Library/Developer/CoreSimulator ~/Library/Developer/CoreSimulator || true
          sudo rm -rf ~/Library/Android /Users/runner/Library/Android ~/.dotnet /usr/local/share/dotnet || true
          sudo rm -rf ~/hostedtoolcache /Users/runner/hostedtoolcache || true
          df -h /

      - name: Clone
        uses: actions/checkout@v4
        with:
          path: freshGram
          ref: ${{ github.event.inputs.source_ref || github.ref }}
          submodules: recursive

      - name: Install tools
        run: |
          brew install automake libtool cmake wget pkg-config gnu-tar ninja nasm meson zstd
          sudo xcode-select -s /Applications/Xcode.app/Contents/Developer

      - name: Download libraries
        uses: actions/download-artifact@v4
        with:
          name: macos-libraries

      - name: Unpack libraries
        run: |
          gtar -I 'zstd -T0' -xf libraries.tar.zst
          rm libraries.tar.zst
          df -h /

      - name: Configure
        env:
          API_ID: ${{ secrets.API_ID }}
          API_HASH: ${{ secrets.API_HASH }}
          RUNTIME_KEY: ${{ vars.FRESHGRAM_RUNTIME_KEY }}
        run: |
          cd freshGram/Telegram
          # std::filesystem in whisper.cpp, Tesseract and the settings needs 10.15.
          ./configure.sh \
            -D TDESKTOP_API_ID="$API_ID" \
            -D TDESKTOP_API_HASH="$API_HASH" \
            -D FRESHGRAM_RUNTIME_KEY="$RUNTIME_KEY" \
            -D CMAKE_CXX_FLAGS_DEBUG=-g1 \
            -D CMAKE_OSX_ARCHITECTURES=${{ matrix.arch }} \
            -D CMAKE_OSX_DEPLOYMENT_TARGET=10.15 \
            -D DESKTOP_APP_DISABLE_AUTOUPDATE=ON \
            -D DESKTOP_APP_DISABLE_CRASH_REPORTS=ON

      - name: Build
        run: |
          cd freshGram
          for attempt in 1 2 3; do
            if cmake --build out --config "$BUILD_CONFIG" --target Telegram; then
              exit 0
            fi
            echo "::warning::Build attempt $attempt failed, trying again"
            python3 .github/scripts/drop_broken_objects.py out > /dev/null
          done
          exit 1

      - name: Resolve release tag
        id: release
        run: |
          tag=""
          if [ "${{ github.ref_type }}" = "tag" ]; then
            tag="${{ github.ref_name }}"
          elif [ -n "${{ github.event.inputs.release_tag }}" ]; then
            tag="${{ github.event.inputs.release_tag }}"
          fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          pre=false
          if [[ "$tag" =~ ^v[0-9]+\.[0-9]+\.[0-9]+\.[0-9]+ || "$tag" == *beta* ]]; then
            pre=true
          fi
          echo "prerelease=$pre" >> "$GITHUB_OUTPUT"

      - name: Package
        run: |
          set -e
          app=$(find "freshGram/out/$BUILD_CONFIG" -maxdepth 1 -name '*.app' | head -1)
          test -n "$app"
          icon="$app/Contents/Resources/AppIcon-Default.icns"
          if [ ! -f "$icon" ]; then
            echo "::error::The application icon is missing from the bundle: $icon"
            exit 1
          fi
          mkdir -p dist dmg
          if [ -n "${{ steps.release.outputs.tag }}" ]; then
            mkdir -p debug-input
            echo "${{ steps.release.outputs.tag }}" > debug-input/release-tag.txt
            ditto -c -k --sequesterRsrc --keepParent "$app" "debug-input/freshGram-${{ matrix.suffix }}.app.zip"
          fi
          rm -rf dmg/freshGram.app
          cp -R "$app" dmg/freshGram.app
          binary=$(find dmg/freshGram.app/Contents/MacOS -type f | head -1)
          before=$(stat -f %z "$binary")
          strip -x "$binary" || echo "::warning::strip failed, packing the binary as it is"
          echo "Stripped $binary: $before -> $(stat -f %z "$binary") bytes"
          codesign --force --deep --sign - dmg/freshGram.app
          ln -s /Applications dmg/Applications
          cp "$icon" dmg/.VolumeIcon.icns
          SetFile -a C dmg || echo "::warning::The volume icon flag was not set"
          hdiutil create -volname freshGram -srcfolder dmg -ov -format UDZO dist/freshGram-${{ matrix.suffix }}.dmg
          (cd dist && shasum -a 256 freshGram-${{ matrix.suffix }}.dmg > SHA256SUMS-macos-${{ matrix.suffix }})

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: freshGram-macos-${{ matrix.suffix }}
          path: dist/
          retention-days: 7

      - name: Upload the debug input
        if: steps.release.outputs.tag != ''
        uses: actions/upload-artifact@v4
        with:
          name: macos-debug-input-${{ matrix.suffix }}
          path: debug-input/
          retention-days: 14
          compression-level: 0

      - name: Publish release
        if: steps.release.outputs.tag != ''
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.release.outputs.tag }}
          name: freshGram ${{ steps.release.outputs.tag }}
          prerelease: ${{ steps.release.outputs.prerelease }}
          generate_release_notes: true
          files: |
            dist/freshGram-${{ matrix.suffix }}.dmg
            dist/SHA256SUMS-macos-${{ matrix.suffix }}
