name: Build Windows

on:
  push:
    branches-ignore:
      - 'dependabot/**'
    tags:
      - 'v*'
    paths-ignore:
      - 'docs/**'
      - '**.md'
      - 'changelog.txt'
      - 'LEGAL'
      - 'LICENSE'
      - 'Telegram/build/docker/centos_env/**'
      - '.github/workflows/build-env.yml'
      - '.github/workflows/build.yml'
  workflow_dispatch:
    inputs:
      release_tag:
        description: Publish a GitHub release with this tag (for example v7.2.18), leave empty to only build
        type: string
        required: false
      source_ref:
        description: Tag, branch or commit to build instead of the one the workflow is started on
        type: string
        required: false

concurrency:
  group: build-windows-${{ github.ref }}-${{ github.event_name }}-${{ github.event.inputs.release_tag }}
  cancel-in-progress: ${{ github.event_name != 'workflow_dispatch' && !startsWith(github.ref, 'refs/tags/') }}

permissions:
  contents: write

jobs:
  windows:
    name: Windows x64 portable
    runs-on: windows-2025
    timeout-minutes: 360

    steps:
      - name: Check API credentials
        shell: pwsh
        env:
          API_ID: ${{ secrets.API_ID }}
          API_HASH: ${{ secrets.API_HASH }}
        run: |
          if (-not $env:API_ID -or -not $env:API_HASH) {
            Write-Host "::error::Repository secrets API_ID and API_HASH are required, see docs/api_credentials.md."
            exit 1
          }

      - name: Clone
        uses: actions/checkout@v4
        with:
          path: freshGram
          ref: ${{ github.event.inputs.source_ref || github.ref }}
          submodules: recursive

      - name: Get the CI scripts
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}
          path: ci
          sparse-checkout: .github/scripts

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Restore libraries
        id: libraries
        uses: actions/cache/restore@v4
        with:
          path: |
            Libraries
            win64
            ThirdParty
          key: windows-libraries-v3-${{ hashFiles('freshGram/Telegram/build/prepare/**', 'freshGram/Telegram/build/qt_version.py') }}-${{ github.run_id }}
          restore-keys: windows-libraries-v3-${{ hashFiles('freshGram/Telegram/build/prepare/**', 'freshGram/Telegram/build/qt_version.py') }}-

      - name: Install ATL and MFC for the toolset
        shell: pwsh
        run: |
          $installer = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer"
          $vs = & "$installer\vswhere.exe" -latest -products * -property installationPath
          $tools = Join-Path $vs "VC\Tools\MSVC"
          function Show-Atl {
            Get-ChildItem $tools | ForEach-Object {
              "$($_.Name): atlbase.h=$(Test-Path (Join-Path $_.FullName 'atlmfc\include\atlbase.h'))"
            }
          }
          Show-Atl
          $process = Start-Process -Wait -PassThru -FilePath "$installer\vs_installer.exe" -ArgumentList @(
            "modify", "--installPath", "`"$vs`"",
            "--add", "Microsoft.VisualStudio.Component.VC.14.44.17.14.ATL",
            "--add", "Microsoft.VisualStudio.Component.VC.14.44.17.14.MFC",
            "--quiet", "--norestart", "--noUpdateInstaller")
          "Installer exit code: $($process.ExitCode)"
          Show-Atl
          $found = Get-ChildItem $tools | Where-Object { $_.Name -like '14.44*' -and (Test-Path (Join-Path $_.FullName 'atlmfc\include\atlbase.h')) }
          if (-not $found) {
            Write-Host "::error::ATL for the 14.44 toolset is still missing."
            exit 1
          }

      - name: Set up the Visual Studio environment
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64
          toolset: '14.44'

      - name: Prepare libraries
        id: prepare
        continue-on-error: true
        timeout-minutes: 300
        shell: cmd
        run: freshGram\Telegram\build\prepare\win.bat silent qt6

      - name: Save libraries
        if: always() && steps.libraries.outcome == 'success'
        uses: actions/cache/save@v4
        with:
          path: |
            Libraries
            win64
            ThirdParty
          key: windows-libraries-v3-${{ hashFiles('freshGram/Telegram/build/prepare/**', 'freshGram/Telegram/build/qt_version.py') }}-${{ github.run_id }}

      - name: Stop when libraries are not ready
        if: steps.prepare.outcome != 'success'
        shell: pwsh
        run: |
          Write-Host "::error::Preparing the libraries did not finish in time. The finished part is cached, run the workflow again to continue."
          exit 1

      - name: Configure
        shell: cmd
        env:
          API_ID: ${{ secrets.API_ID }}
          API_HASH: ${{ secrets.API_HASH }}
        run: |
          cd freshGram\Telegram
          call configure.bat x64 qt6 -D TDESKTOP_API_ID=%API_ID% -D TDESKTOP_API_HASH=%API_HASH% -D DESKTOP_APP_DISABLE_AUTOUPDATE=ON -D DESKTOP_APP_DISABLE_CRASH_REPORTS=ON

      - name: Build
        id: build
        continue-on-error: true
        shell: pwsh
        run: ./ci/.github/scripts/windows-build.ps1

      - name: Add paging space for the link
        id: pagefile
        if: steps.build.outcome == 'failure'
        continue-on-error: true
        shell: pwsh
        run: ./ci/.github/scripts/windows-pagefile.ps1

      - name: Link again with more paging space
        id: relink
        if: steps.build.outcome == 'failure' && steps.pagefile.outcome == 'success'
        continue-on-error: true
        shell: pwsh
        run: ./ci/.github/scripts/windows-build.ps1

      - name: Link again with lld-link
        id: lld
        if: steps.build.outcome == 'failure' && steps.relink.outcome != 'success'
        continue-on-error: true
        shell: pwsh
        run: |
          $llvm = if ($env:llvmX64) { $env:llvmX64 } else { Join-Path $env:VCINSTALLDIR 'Tools\Llvm\x64\bin' }
          Write-Host "lld-link: $(Test-Path (Join-Path $llvm 'lld-link.exe')) in $llvm"
          ./ci/.github/scripts/windows-build.ps1 -ExtraArguments @("/p:LinkToolPath=$llvm", '/p:LinkToolExe=lld-link.exe')

      - name: Stop when the build failed
        if: steps.build.outcome == 'failure' && steps.relink.outcome != 'success' && steps.lld.outcome != 'success'
        shell: pwsh
        run: |
          Write-Host "::error::Telegram.exe was not built: the compile or link failed, see the steps above."
          exit 1

      - name: Package
        shell: pwsh
        run: |
          $exe = Get-ChildItem freshGram/out/Release -Filter freshGram.exe | Select-Object -First 1
          if (-not $exe) { throw "freshGram.exe was not built" }
          New-Item -ItemType Directory -Force dist | Out-Null
          Copy-Item $exe.FullName dist/freshGram.exe
          New-Item -ItemType Directory -Force portable/TelegramForcePortable | Out-Null
          Copy-Item $exe.FullName portable/freshGram.exe
          Compress-Archive -Path portable/* -DestinationPath dist/freshGram-windows-portable.zip -Force
          $hashes = Get-ChildItem dist -File | Where-Object { $_.Name -ne 'SHA256SUMS-windows' } | ForEach-Object {
            "$((Get-FileHash $_.FullName -Algorithm SHA256).Hash.ToLower())  $($_.Name)"
          }
          $hashes | Set-Content dist/SHA256SUMS-windows

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: freshGram-windows-x64
          path: dist/
          retention-days: 7

      - name: Collect symbols
        continue-on-error: true
        shell: pwsh
        run: |
          $pdb = Get-ChildItem freshGram/out/Release -Filter *.pdb -ErrorAction SilentlyContinue
          if ($pdb) {
            New-Item -ItemType Directory -Force symbols | Out-Null
            7z a -mx=3 symbols/freshGram-pdb.7z ($pdb | ForEach-Object { $_.FullName })
          } else {
            Write-Host "No .pdb files were found in freshGram/out/Release."
          }

      - name: Upload symbols
        if: hashFiles('symbols/*.7z') != ''
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: freshGram-windows-x64-symbols
          path: symbols/
          retention-days: 30

      - name: Resolve release tag
        id: release
        shell: bash
        run: |
          tag=""
          if [ "${{ github.ref_type }}" = "tag" ]; then
            tag="${{ github.ref_name }}"
          elif [ -n "${{ github.event.inputs.release_tag }}" ]; then
            tag="${{ github.event.inputs.release_tag }}"
          fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          pre=false
          if [[ "$tag" =~ ^v[0-9]+\.[0-9]+\.[0-9]+\.[0-9]+ || "$tag" == *beta* ]]; then
            pre=true
          fi
          echo "prerelease=$pre" >> "$GITHUB_OUTPUT"

      - name: Publish release
        if: steps.release.outputs.tag != ''
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.release.outputs.tag }}
          name: freshGram ${{ steps.release.outputs.tag }}
          prerelease: ${{ steps.release.outputs.prerelease }}
          generate_release_notes: true
          files: |
            dist/freshGram.exe
            dist/freshGram-windows-portable.zip
            dist/SHA256SUMS-windows
