name: Build Windows

on:
  push:
    branches-ignore:
      - 'dependabot/**'
    tags:
      - 'v*'
    paths-ignore:
      - 'docs/**'
      - '**.md'
      - 'changelog.txt'
      - 'LEGAL'
      - 'LICENSE'
      - 'Telegram/build/docker/centos_env/**'
      - '.github/workflows/build-env.yml'
      - '.github/workflows/build.yml'
  workflow_dispatch:
    inputs:
      release_tag:
        description: Publish a GitHub release with this tag (for example v7.2.18), leave empty to only build
        type: string
        required: false
      source_ref:
        description: Tag, branch or commit to build instead of the one the workflow is started on
        type: string
        required: false

concurrency:
  group: build-windows-${{ github.ref }}-${{ github.event_name }}-${{ github.event.inputs.release_tag }}
  cancel-in-progress: ${{ github.event_name != 'workflow_dispatch' && !startsWith(github.ref, 'refs/tags/') }}

permissions:
  contents: write

env:
  BUILD_CONFIG: ${{ (github.ref_type == 'tag' || github.event.inputs.release_tag != '') && 'Release' || 'Debug' }}

jobs:
  windows:
    name: Windows ${{ matrix.arch }} portable
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 360
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x64
            runner: windows-2025
            toolset: '14.44'
            libraries: qt5
            components: Microsoft.VisualStudio.Component.VC.14.44.17.14.ATL Microsoft.VisualStudio.Component.VC.14.44.17.14.MFC
            llvm: x64
            python: '3.10'
            suffix: ''
          - arch: arm64
            runner: windows-11-arm
            toolset: ''
            libraries: arm64-qt6
            components: Microsoft.VisualStudio.Component.VC.ATL.ARM64 Microsoft.VisualStudio.Component.VC.MFC.ARM64
            llvm: ARM64
            python: '3.12'
            suffix: '-arm64'

    steps:
      - name: Check API credentials
        shell: pwsh
        env:
          API_ID: ${{ secrets.API_ID }}
          API_HASH: ${{ secrets.API_HASH }}
        run: |
          if (-not $env:API_ID -or -not $env:API_HASH) {
            Write-Host "::error::Repository secrets API_ID and API_HASH are required, see docs/api_credentials.md."
            exit 1
          }

      - name: Clone
        uses: actions/checkout@v4
        with:
          path: freshGram
          ref: ${{ github.event.inputs.source_ref || github.ref }}
          submodules: recursive

      - name: Get the CI scripts
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}
          path: ci
          sparse-checkout: .github/scripts

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}

      - name: Restore libraries
        id: libraries
        uses: actions/cache/restore@v4
        with:
          path: |
            Libraries
            win64
            ThirdParty
          key: windows-libraries-${{ matrix.libraries }}-v1-${{ hashFiles('freshGram/Telegram/build/prepare/**', 'freshGram/Telegram/build/qt_version.py') }}-${{ github.run_id }}
          restore-keys: windows-libraries-${{ matrix.libraries }}-v1-${{ hashFiles('freshGram/Telegram/build/prepare/**', 'freshGram/Telegram/build/qt_version.py') }}-

      - name: Install ATL and MFC for the toolset
        shell: pwsh
        env:
          COMPONENTS: ${{ matrix.components }}
          TOOLSET: ${{ matrix.toolset }}
        run: |
          $installer = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer"
          $vs = & "$installer\vswhere.exe" -latest -products * -property installationPath
          $tools = Join-Path $vs "VC\Tools\MSVC"
          function Show-Atl {
            Get-ChildItem $tools | ForEach-Object {
              "$($_.Name): atlbase.h=$(Test-Path (Join-Path $_.FullName 'atlmfc\include\atlbase.h'))"
            }
          }
          Show-Atl
          $add = $env:COMPONENTS -split ' ' | ForEach-Object { '--add', $_ }
          $process = Start-Process -Wait -PassThru -FilePath "$installer\vs_installer.exe" -ArgumentList (@(
            "modify", "--installPath", "`"$vs`"") + $add + @(
            "--quiet", "--norestart", "--noUpdateInstaller"))
          "Installer exit code: $($process.ExitCode)"
          Show-Atl
          $found = Get-ChildItem $tools | Where-Object { $_.Name -like "$env:TOOLSET*" -and (Test-Path (Join-Path $_.FullName 'atlmfc\include\atlbase.h')) }
          if (-not $found) {
            Write-Host "::error::ATL for the $env:TOOLSET toolset is still missing."
            exit 1
          }

      - name: Set up the Visual Studio environment
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: ${{ matrix.arch }}
          toolset: ${{ matrix.toolset }}

      - name: Prepare libraries
        id: prepare
        continue-on-error: true
        timeout-minutes: 300
        shell: cmd
        run: freshGram\Telegram\build\prepare\win.bat silent

      - name: Save libraries
        if: always() && steps.libraries.outcome == 'success'
        uses: actions/cache/save@v4
        with:
          path: |
            Libraries
            win64
            ThirdParty
          key: windows-libraries-${{ matrix.libraries }}-v1-${{ hashFiles('freshGram/Telegram/build/prepare/**', 'freshGram/Telegram/build/qt_version.py') }}-${{ github.run_id }}

      - name: Stop when libraries are not ready
        if: steps.prepare.outcome != 'success'
        shell: pwsh
        run: |
          Write-Host "::error::Preparing the libraries did not finish in time. The finished part is cached, run the workflow again to continue."
          exit 1

      - name: Configure
        shell: cmd
        env:
          API_ID: ${{ secrets.API_ID }}
          API_HASH: ${{ secrets.API_HASH }}
        run: |
          cd freshGram\Telegram
          call configure.bat ${{ matrix.arch }} -D TDESKTOP_API_ID=%API_ID% -D TDESKTOP_API_HASH=%API_HASH% -D DESKTOP_APP_DISABLE_AUTOUPDATE=ON -D DESKTOP_APP_DISABLE_CRASH_REPORTS=ON

      - name: Build
        id: build
        continue-on-error: true
        shell: pwsh
        run: ./freshGram/.github/scripts/windows-build.ps1 -Configuration $env:BUILD_CONFIG

      - name: Add paging space for the link
        id: pagefile
        if: steps.build.outcome == 'failure'
        continue-on-error: true
        shell: pwsh
        run: ./ci/.github/scripts/windows-pagefile.ps1

      - name: Link again with more paging space
        id: relink
        if: steps.build.outcome == 'failure' && steps.pagefile.outcome == 'success'
        continue-on-error: true
        shell: pwsh
        run: ./freshGram/.github/scripts/windows-build.ps1 -Configuration $env:BUILD_CONFIG

      - name: Link again with lld-link
        id: lld
        if: steps.build.outcome == 'failure' && steps.relink.outcome != 'success'
        continue-on-error: true
        shell: pwsh
        run: |
          $llvm = if ($env:llvmX64 -and '${{ matrix.arch }}' -eq 'x64') { $env:llvmX64 } else { Join-Path $env:VCINSTALLDIR 'Tools\Llvm\${{ matrix.llvm }}\bin' }
          Write-Host "lld-link: $(Test-Path (Join-Path $llvm 'lld-link.exe')) in $llvm"
          ./freshGram/.github/scripts/windows-build.ps1 -Configuration $env:BUILD_CONFIG -ExtraArguments @("/p:LinkToolPath=$llvm", '/p:LinkToolExe=lld-link.exe')

      - name: Stop when the build failed
        if: steps.build.outcome == 'failure' && steps.relink.outcome != 'success' && steps.lld.outcome != 'success'
        shell: pwsh
        run: |
          Write-Host "::error::Telegram.exe was not built: the compile or link failed, see the steps above."
          exit 1

      - name: Package
        shell: pwsh
        env:
          SUFFIX: ${{ matrix.suffix }}
        run: |
          $exe = Get-ChildItem "freshGram/out/$env:BUILD_CONFIG" -Filter freshGram.exe | Select-Object -First 1
          if (-not $exe) { throw "freshGram.exe was not built" }
          New-Item -ItemType Directory -Force dist | Out-Null
          Copy-Item $exe.FullName "dist/freshGram$env:SUFFIX.exe"
          New-Item -ItemType Directory -Force portable/TelegramForcePortable | Out-Null
          Copy-Item $exe.FullName portable/freshGram.exe
          Compress-Archive -Path portable/* -DestinationPath "dist/freshGram-windows$env:SUFFIX-portable.zip" -Force
          $sums = "SHA256SUMS-windows$env:SUFFIX"
          $hashes = Get-ChildItem dist -File | Where-Object { $_.Name -ne $sums } | ForEach-Object {
            "$((Get-FileHash $_.FullName -Algorithm SHA256).Hash.ToLower())  $($_.Name)"
          }
          $hashes | Set-Content "dist/$sums"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: freshGram-windows-${{ matrix.arch }}
          path: dist/
          retention-days: 7

      - name: Collect symbols
        continue-on-error: true
        shell: pwsh
        run: |
          $pdb = Get-ChildItem "freshGram/out/$env:BUILD_CONFIG" -Filter *.pdb -ErrorAction SilentlyContinue
          if ($pdb) {
            New-Item -ItemType Directory -Force symbols | Out-Null
            7z a -mx=3 symbols/freshGram-pdb.7z ($pdb | ForEach-Object { $_.FullName })
          } else {
            Write-Host "No .pdb files were found in freshGram/out/$env:BUILD_CONFIG."
          }

      - name: Upload symbols
        if: hashFiles('symbols/*.7z') != ''
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: freshGram-windows-${{ matrix.arch }}-symbols
          path: symbols/
          retention-days: 30

      - name: Resolve release tag
        id: release
        shell: bash
        run: |
          tag=""
          if [ "${{ github.ref_type }}" = "tag" ]; then
            tag="${{ github.ref_name }}"
          elif [ -n "${{ github.event.inputs.release_tag }}" ]; then
            tag="${{ github.event.inputs.release_tag }}"
          fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          pre=false
          if [[ "$tag" =~ ^v[0-9]+\.[0-9]+\.[0-9]+\.[0-9]+ || "$tag" == *beta* ]]; then
            pre=true
          fi
          echo "prerelease=$pre" >> "$GITHUB_OUTPUT"

      - name: Prepare the debug input
        if: steps.release.outputs.tag != '' && matrix.arch == 'x64'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force debug-input | Out-Null
          Copy-Item dist/freshGram.exe debug-input/freshGram.exe
          if (Test-Path symbols/freshGram-pdb.7z) {
            Copy-Item symbols/freshGram-pdb.7z debug-input/freshGram-pdb.7z
          }
          Set-Content debug-input/release-tag.txt "${{ steps.release.outputs.tag }}"

      - name: Upload the debug input
        if: steps.release.outputs.tag != '' && matrix.arch == 'x64'
        uses: actions/upload-artifact@v4
        with:
          name: windows-debug-input
          path: debug-input/
          retention-days: 14
          compression-level: 0

      - name: Publish release
        if: steps.release.outputs.tag != ''
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.release.outputs.tag }}
          name: freshGram ${{ steps.release.outputs.tag }}
          prerelease: ${{ steps.release.outputs.prerelease }}
          generate_release_notes: true
          files: |
            dist/freshGram${{ matrix.suffix }}.exe
            dist/freshGram-windows${{ matrix.suffix }}-portable.zip
            dist/SHA256SUMS-windows${{ matrix.suffix }}
