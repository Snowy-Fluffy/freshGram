name: Secret chat checks

on:
  push:
    branches: [main, fix/secret-pfs]
  pull_request:
    paths:
      - 'Telegram/SourceFiles/ayu/secret/**'
      - '.github/workflows/secret-chat-checks.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  protocol-tests:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install test dependencies
        run: sudo apt-get update && sudo apt-get install -y g++ libssl-dev
      - name: Run PFS decisions
        run: |
          g++ -std=c++20 -Wall -Wextra -Werror -I Telegram/SourceFiles \
            Telegram/SourceFiles/ayu/secret/secret_rekey_test.cpp -o /tmp/secret-rekey-test
          /tmp/secret-rekey-test
      - name: Run PFS wire-format regressions
        run: |
          g++ -std=c++20 -Wall -Wextra -Werror -Wno-deprecated-declarations \
            -I Telegram/SourceFiles \
            Telegram/SourceFiles/ayu/secret/secret_protocol.cpp \
            Telegram/SourceFiles/ayu/secret/secret_model.cpp \
            Telegram/SourceFiles/ayu/secret/secret_crypto.cpp \
            Telegram/SourceFiles/ayu/secret/secret_protocol_test.cpp \
            Telegram/SourceFiles/ayu/secret/secret_test_stubs.cpp \
            -lcrypto -o /tmp/secret-protocol-test
          /tmp/secret-protocol-test
