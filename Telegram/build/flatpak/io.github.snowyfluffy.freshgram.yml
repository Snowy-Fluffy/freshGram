app-id: io.github.snowyfluffy.freshgram
runtime: org.gnome.Platform
runtime-version: '51'
sdk: org.gnome.Sdk
command: freshGram
finish-args:
  - --share=ipc
  - --share=network
  - --socket=x11
  - --socket=wayland
  - --socket=pulseaudio
  - --device=dri
  - --filesystem=xdg-download
  - --talk-name=org.freedesktop.Notifications
  - --talk-name=org.kde.StatusNotifierWatcher
  - --talk-name=org.freedesktop.portal.Desktop
modules:
  - name: freshgram
    buildsystem: simple
    build-commands:
      - cp -a usr/. /app/
      - rm -rf /app/share/icons/hicolor/512x512@2
      - sed -i -e 's|^Exec=env DESKTOPINTEGRATION=1 freshGram|Exec=freshGram|' -e '/^TryExec=/d' /app/share/applications/io.github.snowyfluffy.freshgram.desktop
      - sed -i 's|^Exec=.*|Exec=/app/bin/freshGram|' /app/share/dbus-1/services/io.github.snowyfluffy.freshgram.service
    sources:
      - type: dir
        path: root
